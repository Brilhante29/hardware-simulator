; Bengala inteligente: HC-SR04 (TRIG D9, ECHO D10) mede o obstáculo; o vibracall (D5, PWM) vibra mais forte
; quanto mais perto e o buzzer (D6) bipa cada vez mais rápido, como sensor de ré. Botão D2 alterna
; "só vibração" (silencioso, para lugares públicos) e "vibração + som". OLED mostra distância e modo.
[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit BusIO@^1.17.0

[env:nano]
board = nanoatmega328new

[env:mega]
board = megaatmega2560
