; Estação de conforto para sala de aula ou home office: BME280 (temperatura, umidade, pressão) e BH1750 (luz)
; no I²C, OLED com os números e uma barra de 8 NeoPixels (D6): 4 para o conforto térmico, 4 para a iluminação.
; Buzzer (D3) avisa calor perigoso (índice de calor ≥ 41 °C, faixa "perigo" do NWS).
[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
lib_deps =
  adafruit/Adafruit BME280 Library@^2.2.4
  adafruit/Adafruit Unified Sensor@^1.1.14
  adafruit/Adafruit BusIO@^1.17.0
  claws/BH1750@^1.3.0
  adafruit/Adafruit NeoPixel@^1.12.3
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1

[env:nano]
board = nanoatmega328new

[env:mega]
board = megaatmega2560
