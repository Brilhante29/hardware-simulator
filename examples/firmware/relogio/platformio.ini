; Relógio inteligente de pulso (protótipo): OLED 128×64, RTC DS3231, acelerômetro MPU6050 (AD0 em VCC → 0x69),
; botão no D2, motor de vibração no D5 (via transistor) e bateria Li-ion no A0 (divisor 1:1).
; Compile e rode no Hardware Studio: pio run  →  editor "Compilar pasta…"  ou  pio run -t simulate
[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/RTClib@^2.1.4
  adafruit/Adafruit BusIO@^1.17.0

[env:nano]
board = nanoatmega328new

[env:uno]
board = uno

[env:mega]
board = megaatmega2560
