; Relógio inteligente colorido: tela redonda GC9A01 (240×240, SPI), batimento e SpO2 pelo MAX30102, hora no DS3231,
; passos no MPU6050 (0x69), botão no D2, vibracall no D5 e bateria no A0. Mesmo ATmega328P do Uno/Nano.
[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
lib_deps =
  adafruit/Adafruit GC9A01A@^1.1.1
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit BusIO@^1.17.0
  adafruit/RTClib@^2.1.4
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:nano]
board = nanoatmega328new

[env:mega]
board = megaatmega2560
