; Pulseira detectora de queda: MPU6050 (±8 g) reconhece queda livre → impacto → imobilidade deitada,
; vibra e mostra contagem de 10 s no OLED; o botão (D2) cancela ("estou bem"); senão dispara o alerta
; (sirene no buzzer D6, LED D13 e mensagem na serial, onde ficaria o módulo GSM/BLE).
[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit BusIO@^1.17.0

[env:nano]
board = nanoatmega328new

[env:mega]
board = megaatmega2560
