; HS-Pulse: pulseira de triagem de fibrilação atrial (FA), a arritmia que multiplica o risco de AVC.
; MAX30102 (PPG no pulso), MPU6050 (movimento: qualidade do sinal), tela redonda GC9A01, vibracall (D5), botão (D2).
; Telemetria em JSON por linha na serial, onde ficaria o módulo BLE (HM-10, UART transparente) para o celular/edge.
[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
lib_deps =
  adafruit/Adafruit GC9A01A@^1.1.1
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit BusIO@^1.17.0
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:nano]
board = nanoatmega328new

[env:mega]
board = megaatmega2560
